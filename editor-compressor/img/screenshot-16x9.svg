<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Editor Compressor before and after compression placeholder">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#101014"/>
      <stop offset="100%" stop-color="#151a17"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>

  <!-- "before" card: larger file -->
  <rect x="140" y="180" width="480" height="480" rx="28" fill="#1a1a1e" stroke="#2a2a30"/>
  <rect x="180" y="220" width="200" height="24" rx="8" fill="#2a2a30"/>
  <rect x="180" y="270" width="400" height="300" rx="16" fill="#141417"/>
  <text x="180" y="620" font-family="Georgia, serif" font-size="26" fill="#8a8a90">248 MB</text>

  <!-- arrow -->
  <path d="M 700 420 L 900 420 L 900 370 L 980 440 L 900 510 L 900 460 L 700 460 Z" fill="#3effa3"/>

  <!-- "after" card: compressed file, smaller -->
  <rect x="1050" y="260" width="340" height="340" rx="24" fill="#1a1a1e" stroke="#2a2a30"/>
  <rect x="1080" y="292" width="140" height="18" rx="6" fill="#2eb279"/>
  <rect x="1080" y="326" width="280" height="200" rx="12" fill="#141417"/>
  <text x="1080" y="562" font-family="Georgia, serif" font-size="24" fill="#3effa3" font-weight="bold">18 MB</text>

  <text x="800" y="800" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#8a8a90">
    Replace with a real 16:9 app screenshot
  </text>
</svg>
